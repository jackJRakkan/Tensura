<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tensura Combat Terminal</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: transparent;
      color: #e2e8f0;
      font-family: 'Noto Sans SC', sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: calc(100vh - 20px);
      box-sizing: border-box;
      overflow: hidden;
    }
    /* Thanh máu HP */
    .combat-hp-container {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      padding: 8px;
      flex-shrink: 0;
    }
    .combat-hp-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8em;
      color: #fca5a5;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .combat-hp-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .combat-hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #be123c, #f43f5e);
      width: 0%;
      transition: width 0.3s ease;
    }
    /* Khung Chat Log */
    #combat-chat-log {
      flex-grow: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 10px;
      font-size: 0.9em;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      user-select: text;
    }
    /* Khung nhập liệu */
    .combat-input-area {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    #combat-chat-input {
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 4px;
      padding: 8px;
      resize: none;
      height: 40px;
      font-family: inherit;
      font-size: 0.9em;
      line-height: 1.3;
      box-sizing: border-box;
    }
    #combat-chat-input:focus {
      outline: none;
      border-color: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }
    #combat-send-btn {
      background: #dc2626;
      color: white;
      border: 1px solid #ef4444;
      border-radius: 4px;
      width: 45px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #combat-send-btn:hover {
      background: #b91c1c;
    }
    /* Bộ nút Reroll */
    .combat-grid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .combat-btn {
      background: linear-gradient(145deg, rgba(50, 50, 50, 0.8), rgba(30, 30, 30, 0.9));
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .combat-btn:hover {
      transform: translateY(-1px);
      color: #fff;
    }
    .btn-reroll-var:hover { border-color: #ffb700; box-shadow: 0 0 8px rgba(255, 183, 0, 0.3); }
    .btn-reroll-text:hover { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
    .btn-skip:hover { border-color: #ef4444; color: #f87171; box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
    
    /* BẢNG CHỌN CHIÊU THỨC / KỸ NĂNG */
    #skills-panel {
      position: absolute;
      bottom: 105px;
      left: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.98);
      border: 1.5px solid #ef4444;
      border-radius: 6px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
    }
    .skills-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85em;
      font-weight: bold;
      color: #fca5a5;
      border-bottom: 1px solid rgba(239, 68, 68, 0.3);
      padding-bottom: 4px;
    }
    .skill-select-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85em;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: background 0.2s;
    }
    .skill-select-item:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
    }
    
    details {
      margin-top: 5px;
      background: rgba(0, 0, 0, 0.3);
      padding: 5px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    summary {
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.8em;
      user-select: none;
    }
    pre {
      font-size: 0.8em;
      color: #64748b;
      margin: 5px 0 0 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- Thanh máu HP -->
  <div class="combat-hp-container">
    <div class="combat-hp-label">
      <span>Sinh lực phu quân (HP)</span>
      <span id="hp-text">--/--</span>
    </div>
    <div class="combat-hp-bar">
      <div id="hp-fill" class="combat-hp-fill"></div>
    </div>
  </div>

  <!-- Khung hiển thị nhật ký chiến đấu -->
  <div id="combat-chat-log">
    <div style="text-align: center; color: #fca5a5; font-style: italic;">Hệ thống chiến đấu đã sẵn sàng. Hãy nhập hành động giao tranh!</div>
  </div>

  <!-- BẢNG CHỌN CHIÊU THỨC / KỸ NĂNG (ẨN HIỆN ĐƯỢC) -->
  <div id="skills-panel">
    <div class="skills-panel-header">
      <span>⚔️ CHỌN CHIÊU THỨC TẤN CÔNG</span>
      <span id="close-skills-panel-btn" style="cursor: pointer; padding: 0 5px;"><i class="fas fa-times"></i></span>
    </div>
    <div id="skills-list" style="display: flex; flex-direction: column; gap: 5px;">
      <!-- Đánh thường và kỹ năng sẽ tự động đổ vào đây -->
    </div>
  </div>

  <!-- Khung nhập lệnh -->
  <div class="combat-input-area">
    <button id="toggle-skills-btn" class="combat-btn" style="width: 45px; height: 40px; margin: 0; border-color: #ef4444; color: #ef4444;" title="Chọn Kỹ năng / Đánh thường"><i class="fas fa-fist-raised"></i></button>
    <textarea id="combat-chat-input" placeholder="Nhập hành động hoặc chọn chiêu thức..."></textarea>
    <button id="combat-send-btn" title="Gửi lệnh"><i class="fas fa-paper-plane"></i></button>
  </div>

  <!-- Bộ ba nút Reroll/Skip -->
  <div class="combat-grid-buttons">
    <button class="combat-btn btn-reroll-var" id="btn-reroll-var"><i class="fas fa-dice"></i> Reroll Biến</button>
    <button class="combat-btn btn-reroll-text" id="btn-reroll-text"><i class="fas fa-pencil-alt"></i> Reroll Lượt</button>
    <button class="combat-btn btn-skip" id="btn-skip" style="grid-column: 1 / -1;"><i class="fas fa-running"></i> Bỏ Qua Chiến Đấu</button>
  </div>

  <script>
    const chatLog = document.getElementById('combat-chat-log');
    const chatInput = document.getElementById('combat-chat-input');
    const sendBtn = document.getElementById('combat-send-btn');
    const skillsPanel = document.getElementById('skills-panel');
    const skillsList = document.getElementById('skills-list');
    let isGenerating = false;

    // 1. NHẬN THÔNG TIN TỪ GAME CHÍNH (HP, KỸ NĂNG & CẬP NHẬT LOG)
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      const { type, hp, maxHp, logText, skills, techniques } = e.data;

      // Cập nhật máu HP
      if (type === 'COMBAT_UPDATE_HP') {
        const percent = Math.min(100, Math.max(0, Math.floor((hp / maxHp) * 100)));
        document.getElementById('hp-text').textContent = `${hp}/${maxHp}`;
        document.getElementById('hp-fill').style.width = `${percent}%`;
      }

      // Nạp danh sách kỹ năng và ma pháp vào bảng chọn
      if (type === 'COMBAT_SET_SKILLS') {
        skillsList.innerHTML = '';
        
        // 1. Thêm nút Đánh thường mặc định
        const normalAttack = document.createElement('div');
        normalAttack.className = 'skill-select-item';
        normalAttack.innerHTML = `<strong>Tấn công vật lý thường</strong><span style="color: #cbd5e1;">Vật công</span>`;
        normalAttack.onclick = () => selectAction('Ta vung vũ khí lao lên thực hiện một đòn tấn công vật lý thường vào kẻ địch!');
        skillsList.appendChild(normalAttack);

        // 2. Đổ Kỹ năng phụ (Extra Skill)
        if (Array.isArray(skills)) {
          skills.forEach(s => {
            const item = document.createElement('div');
            item.className = 'skill-select-item';
            item.innerHTML = `<strong>${s['1'] || s.name}</strong><span style="color: #38bdf8;">${s['2'] || 'Kỹ năng'}</span>`;
            item.onclick = () => selectAction(`Ta kích hoạt Kỹ năng [${s['1'] || s.name}] để tấn công kẻ địch! Hiệu quả: ${s['5'] || s.effect || 'gây sát thương'}`);
            skillsList.appendChild(item);
          });
        }

        // 3. Đổ Ma pháp (Magic)
        if (Array.isArray(techniques)) {
          techniques.forEach(t => {
            const item = document.createElement('div');
            item.className = 'skill-select-item';
            item.innerHTML = `<strong>${t['1'] || t.name}</strong><span style="color: #ab47bc;">Ma pháp</span>`;
            item.onclick = () => selectAction(`Ta niệm chú thi triển Ma pháp [${t['1'] || t.name}]! Tiêu hao ma tố, giáng đòn ma pháp thuộc tính vào mục tiêu!`);
            skillsList.appendChild(item);
          });
        }
      }

      // Xử lý luồng Stream phản hồi từ AI
      if (type === 'COMBAT_AI_STREAM') {
        let activeAiMsg = document.getElementById('active-ai-msg');
        if (!activeAiMsg) {
          activeAiMsg = document.createElement('div');
          activeAiMsg.id = 'active-ai-msg';
          activeAiMsg.style.cssText = 'color: #e2e8f0; background: rgba(255, 255, 255, 0.05); padding: 8px; border-radius: 4px; border-left: 2px solid #ef4444; margin-bottom: 5px; white-space: pre-wrap;';
          chatLog.appendChild(activeAiMsg);
        }
        activeAiMsg.textContent = logText;
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      // Khi AI hoàn thành phản hồi
      if (type === 'COMBAT_AI_DONE') {
        const activeAiMsg = document.getElementById('active-ai-msg');
        if (activeAiMsg) {
          activeAiMsg.removeAttribute('id');
          let html = activeAiMsg.innerHTML;
          const upstoreRegex = /&lt;upstore&gt;([\s\S]*?)&lt;\/upstore&gt;/g;
          if (upstoreRegex.test(html)) {
            html = html.replace(upstoreRegex, '<details><summary>⚙️ Xem lệnh hệ thống tính toán (Upstore)</summary><pre>$1</pre></details>');
            activeAiMsg.innerHTML = html;
          }
        }
        isGenerating = false;
        sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      }
    });

    // Chọn chiêu thức từ bảng
    function selectAction(actionText) {
      chatInput.value = actionText;
      skillsPanel.style.display = 'none';
      chatInput.focus();
    }

    // Đóng mở bảng chiêu thức
    document.getElementById('toggle-skills-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      skillsPanel.style.display = (skillsPanel.style.display === 'flex') ? 'none' : 'flex';
    });
    document.getElementById('close-skills-panel-btn').addEventListener('click', () => {
      skillsPanel.style.display = 'none';
    });

    // Gửi tin nhắn chat chiến đấu lên trận pháp chính
    function sendCombatMessage() {
      if (isGenerating) return;
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      isGenerating = true;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const userMsg = document.createElement('div');
      userMsg.style.cssText = 'color: #7dd3fc; background: rgba(14, 165, 233, 0.1); padding: 8px; border-radius: 4px; border-left: 2px solid #38bdf8; margin-bottom: 5px; word-wrap: break-word;';
      userMsg.innerHTML = `<strong>Ngươi:</strong> ${text}`;
      chatLog.appendChild(userMsg);
      chatLog.scrollTop = chatLog.scrollHeight;

      window.parent.postMessage({ type: 'COMBAT_CHAT_SEND', text: text }, '*');
    }

    sendBtn.addEventListener('click', sendCombatMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCombatMessage();
      }
    });

    // Gửi sự kiện Reroll / Skip lên game chính
    document.getElementById('btn-reroll-var').addEventListener('click', () => {
      window.parent.postMessage({ type: 'COMBAT_REROLL_THINKING' }, '*');
    });
    document.getElementById('btn-reroll-text').addEventListener('click', () => {
      window.parent.postMessage({ type: 'COMBAT_REROLL_TEXT' }, '*');
    });
    document.getElementById('btn-skip').addEventListener('click', () => {
      window.parent.postMessage({ type: 'COMBAT_SKIP' }, '*');
    });
  </script>
</body>
</html>
