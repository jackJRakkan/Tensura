<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tensura Combat Terminal OS</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --hp-color: #f43f5e;
      --ep-color: #0284c7;
      --bg-dark: #020617;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    *::-webkit-scrollbar {
      width: 4px;
    }
    *::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    body {
      margin: 0;
      padding: 12px;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* 1. KHUNG CHỈ SỐ NHÂN VẬT (HP & MA TỐ EP) */
    .status-dashboard {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .bar-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hp-label { color: #fda4af; }
    .ep-label { color: #7dd3fc; }

    .progress-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #be123c, #f43f5e);
      width: 100%;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
    }

    .ep-fill {
      height: 100%;
      background: linear-gradient(90deg, #0369a1, #38bdf8);
      width: 100%;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    /* 2. NHẬT KÝ CHIẾN ĐẤU (CHAT LOG) */
    #combat-chat-log {
      flex: 1;
      overflow-y: auto;
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: text;
    }

    .log-msg {
      padding: 8px 12px;
      border-radius: 6px;
      line-height: 1.45;
      animation: fadeIn 0.25s ease-out;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user {
      background: rgba(14, 165, 233, 0.12);
      border-left: 3px solid var(--primary);
      color: #e0f2fe;
    }

    .msg-ai {
      background: rgba(30, 41, 59, 0.5);
      border-left: 3px solid #f43f5e;
      color: #f1f5f9;
    }

    .msg-system {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 4px;
    }

    /* 3. BẢNG CHIÊU THỨC / KỸ NĂNG POPUP */
    #skills-panel {
      position: absolute;
      bottom: 95px;
      left: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      z-index: 100;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }

    .skills-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 6px;
    }

    .skills-category-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 4px 0 2px 2px;
    }

    .skill-select-item {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }

    .skill-select-item:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      transform: translateX(2px);
    }

    /* 4. THANH NHẬP LỆNH GIAO TRANH */
    .combat-input-area {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    #combat-chat-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      color: var(--text-main);
      border-radius: 6px;
      padding: 8px 12px;
      resize: none;
      height: 42px;
      font-family: inherit;
      font-size: 0.85rem;
      line-height: 1.4;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    #combat-chat-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #toggle-skills-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }

    #toggle-skills-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    #combat-send-btn {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: #020617;
      font-weight: bold;
    }

    #combat-send-btn:hover {
      box-shadow: 0 0 12px var(--primary-glow);
      filter: brightness(1.1);
    }

    /* 5. THANH ĐIỀU KHIỂN CHIẾN LƯỢC DƯỚI CÙNG */
    .combat-bottom-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
      flex-shrink: 0;
    }

    .sub-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .sub-btn:hover {
      background: rgba(51, 65, 85, 0.8);
      color: #fff;
    }

    .btn-reroll-var:hover { border-color: #f59e0b; color: #fbbf24; }
    .btn-reroll-text:hover { border-color: #38bdf8; color: #7dd3fc; }
    .btn-skip:hover { border-color: #ef4444; color: #f87171; }

    /* Hộp giải trình Đại Hiền Giả */
    details {
      margin-top: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed #334155;
      border-radius: 5px;
      padding: 6px 8px;
    }
    summary {
      color: #38bdf8;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
    }
    pre {
      font-family: monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 6px 0 0 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- 1. BẢNG ĐIỀU KHIỂN CHỈ SỐ (HP & EP MA TỐ) -->
  <div class="status-dashboard">
    <div class="bar-group">
      <div class="bar-label hp-label">
        <span><i class="fas fa-heart"></i> SINH LỰC PHU QUÂN (HP)</span>
        <span id="hp-text">-- / --</span>
      </div>
      <div class="progress-track">
        <div id="hp-fill" class="hp-fill"></div>
      </div>
    </div>
    <div class="bar-group">
      <div class="bar-label ep-label">
        <span><i class="fas fa-bolt"></i> NĂNG LƯỢNG MA TỐ (EP)</span>
        <span id="ep-text">-- / --</span>
      </div>
      <div class="progress-track">
        <div id="ep-fill" class="ep-fill"></div>
      </div>
    </div>
  </div>

  <!-- 2. KHUNG HIỂN THỊ DIỄN BIẾN GIAO TRANH -->
  <div id="combat-chat-log">
    <div class="log-msg msg-system">
      <i class="fas fa-shield-alt"></i> Trận pháp chiến đấu Tensura OS đã kích hoạt. Đại Hiền Giả đang giám sát trận địa!
    </div>
  </div>

  <!-- 3. BẢNG CHỌN CHIÊU THỨC / ĐỘC HỮU KỸ / MA PHÁP -->
  <div id="skills-panel">
    <div class="skills-header">
      <span><i class="fas fa-crosshairs"></i> CHỌN CHIÊU THỨC / MA PHÁP</span>
      <span id="close-skills-panel-btn" style="cursor: pointer; padding: 2px 6px;"><i class="fas fa-times"></i></span>
    </div>
    <div id="skills-list" style="display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 4px;">
      <!-- Danh sách chiêu thức sẽ tự động render vào đây -->
    </div>
  </div>

  <!-- 4. KHUNG NHẬP HÀNH ĐỘNG -->
  <div class="combat-input-area">
    <button id="toggle-skills-btn" class="action-btn" title="Khai mở kho chiêu thức">
      <i class="fas fa-book-spells"></i>
    </button>
    <textarea id="combat-chat-input" placeholder="Nhập chỉ lệnh tấn công hoặc chọn chiêu thức..."></textarea>
    <button id="combat-send-btn" class="action-btn" title="Ra lệnh">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

  <!-- 5. BỘ BA NÚT ĐIỀU PHỐI CHIẾN CỤC -->
  <div class="combat-bottom-bar">
    <button class="sub-btn btn-reroll-var" id="btn-reroll-var" title="Tính toán lại biến số chiến đấu">
      <i class="fas fa-dice-d20"></i> Reroll Biến
    </button>
    <button class="sub-btn btn-reroll-text" id="btn-reroll-text" title="Viết lại diễn biến lượt này">
      <i class="fas fa-feather-alt"></i> Reroll Lượt
    </button>
    <button class="sub-btn btn-skip" id="btn-skip" title="Thoát khỏi trạng thái giao tranh">
      <i class="fas fa-person-running"></i> Rút Lui / Bỏ Qua
    </button>
  </div>

  <script>
    const chatLog = document.getElementById('combat-chat-log');
    const chatInput = document.getElementById('combat-chat-input');
    const sendBtn = document.getElementById('combat-send-btn');
    const skillsPanel = document.getElementById('skills-panel');
    const skillsList = document.getElementById('skills-list');
    let isGenerating = false;

    // 1. NHẬN THÔNG TIN TỪ TRẬN PHÁP CHÍNH (HP, EP, KỸ NĂNG, STREAM LOG)
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      const { type, hp, maxHp, ep, maxEp, logText, skills, techniques, uniqueSkills } = e.data;

      // Cập nhật Sinh lực HP
      if (type === 'COMBAT_UPDATE_HP' && typeof hp !== 'undefined') {
        const percent = Math.min(100, Math.max(0, Math.floor((hp / (maxHp || 100)) * 100)));
        document.getElementById('hp-text').textContent = `${hp} / ${maxHp || 100}`;
        document.getElementById('hp-fill').style.width = `${percent}%`;
      }

      // Cập nhật Ma Tố EP (nếu có truyền sang)
      if (typeof ep !== 'undefined') {
        const epPercent = Math.min(100, Math.max(0, Math.floor((ep / (maxEp || 100)) * 100)));
        document.getElementById('ep-text').textContent = `${ep} / ${maxEp || 100}`;
        document.getElementById('ep-fill').style.width = `${epPercent}%`;
      }

      // Nạp danh sách kỹ năng, Ma Pháp và Độc Hữu Kỹ vào bảng chọn
      if (type === 'COMBAT_SET_SKILLS') {
        renderSkillsMenu(skills, techniques, uniqueSkills);
      }

      // Nhận luồng Stream phản hồi từ AI
      if (type === 'COMBAT_AI_STREAM') {
        let activeAiMsg = document.getElementById('active-ai-msg');
        if (!activeAiMsg) {
          activeAiMsg = document.createElement('div');
          activeAiMsg.id = 'active-ai-msg';
          activeAiMsg.className = 'log-msg msg-ai';
          chatLog.appendChild(activeAiMsg);
        }
        activeAiMsg.textContent = logText;
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      // Khi AI hoàn tất lượt tài phán
      if (type === 'COMBAT_AI_DONE') {
        const activeAiMsg = document.getElementById('active-ai-msg');
        if (activeAiMsg) {
          activeAiMsg.removeAttribute('id');
          formatAiCombatMessage(activeAiMsg);
        }
        isGenerating = false;
        sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      }
    });

    // 2. RENDER DANH SÁCH CHIÊU THỨC TENSURA
    function renderSkillsMenu(skills = [], techniques = [], uniqueSkills = []) {
      skillsList.innerHTML = '';

      // Tầng 1: Thể thuật & Tấn công thường
      appendCategoryHeader('THỂ THUẬT CƠ SỞ');
      createSkillItem('Tấn công vật lý thường', 'Cận chiến', '#94a3b8', 'Ta vung vũ khí lao lên thực hiện một đòn công kích vật lý trực diện vào đối thủ!');
      createSkillItem('Tư thế thủ vững / Né tránh', 'Ứng phó', '#38bdf8', 'Ta vào thế phòng ngự cẩn trọng, tập trung quan sát chuẩn bị né tránh hoặc đỡ đòn!');

      // Tầng 2: Độc Hữu Kỹ (Unique Skills) nếu có
      if (Array.isArray(uniqueSkills) && uniqueSkills.length > 0) {
        appendCategoryHeader('ĐỘC HỮU KỸ (UNIQUE SKILL)');
        uniqueSkills.forEach(u => {
          const name = u['1'] || u.name || 'Độc Hữu Kỹ';
          createSkillItem(`👑 ${name}`, 'Độc Hữu Kỹ', '#f59e0b', `Ta giải phóng uy năng của Độc Hữu Kỹ [${name}]! ${u['4'] || u.effect || ''}`);
        });
      }

      // Tầng 3: Kỹ năng phụ (Extra Skills)
      if (Array.isArray(skills) && skills.length > 0) {
        appendCategoryHeader('KỸ NĂNG PHỤ (EXTRA SKILL)');
        skills.forEach(s => {
          const name = s['1'] || s.name || 'Kỹ Năng';
          createSkillItem(`⚡ ${name}`, s['2'] || 'Kỹ năng', '#38bdf8', `Ta kích hoạt Kỹ năng [${name}] giáng xuống mục tiêu! Hiệu quả: ${s['5'] || s.effect || 'Sát thương ma vật'}`);
        });
      }

      // Tầng 4: Ma pháp (Magic)
      if (Array.isArray(techniques) && techniques.length > 0) {
        appendCategoryHeader('MA PHÁP (MAGIC)');
        techniques.forEach(t => {
          const name = t['1'] || t.name || 'Ma Pháp';
          createSkillItem(`🔮 ${name}`, 'Ma Pháp', '#c084fc', `Ta vận chuyển ma tố niệm chú thi triển Ma Pháp [${name}]! Công kích ma đạo bao trùm chiến trường!`);
        });
      }
    }

    function appendCategoryHeader(title) {
      const h = document.createElement('div');
      h.className = 'skills-category-title';
      h.textContent = title;
      skillsList.appendChild(h);
    }

    function createSkillItem(name, badge, badgeColor, actionText) {
      const item = document.createElement('div');
      item.className = 'skill-select-item';
      item.innerHTML = `<strong>${name}</strong><span style="color: ${badgeColor}; font-size: 0.7rem; font-weight: bold;">${badge}</span>`;
      item.onclick = () => {
        chatInput.value = actionText;
        skillsPanel.style.display = 'none';
        chatInput.focus();
      };
      skillsList.appendChild(item);
    }

    // 3. ĐỊNH DẠNG TIN NHẮN AI & BÓC TÁCH KHỐI ĐẠI HIỀN GIẢ
    function formatAiCombatMessage(msgEl) {
      let rawText = msgEl.innerHTML;
      
      // Bóc tách khối lệnh <upstore>
      const upstoreRegex = /&lt;upstore&gt;([\s\S]*?)&lt;\/upstore&gt;/gi;
      if (upstoreRegex.test(rawText)) {
        rawText = rawText.replace(upstoreRegex, `
          <details>
            <summary><i class="fas fa-brain"></i> Báo cáo phân tích Đại Hiền Giả (Upstore)</summary>
            <pre>$1</pre>
          </details>
        `);
      }
      msgEl.innerHTML = rawText;
    }

    // 4. BẬT / TẮT BẢNG CHIÊU THỨC
    document.getElementById('toggle-skills-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      skillsPanel.style.display = (skillsPanel.style.display === 'flex') ? 'none' : 'flex';
    });
    document.getElementById('close-skills-panel-btn').addEventListener('click', () => {
      skillsPanel.style.display = 'none';
    });

    // 5. GỬI LỆNH CHIẾN ĐẤU LÊN TRẬN PHÁP CHÍNH
    function sendCombatAction() {
      if (isGenerating) return;
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      isGenerating = true;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      // Hiển thị tin nhắn của người chơi
      const userMsg = document.createElement('div');
      userMsg.className = 'log-msg msg-user';
      userMsg.innerHTML = `<strong>Phu quân:</strong> ${text}`;
      chatLog.appendChild(userMsg);
      chatLog.scrollTop = chatLog.scrollHeight;

      // Bắn tin nhắn qua postMessage lên trang cha
      window.parent.postMessage({ type: 'COMBAT_CHAT_SEND', text: text }, '*');
    }

    sendBtn.addEventListener('click', sendCombatAction);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCombatAction();
      }
    });

    // 6. CÁC NÚT ĐIỀU PHỐI CHIẾN LƯỢC
    document.getElementById('btn-reroll-var').addEventListener('click', () => {
      window.parent.postMessage({ type: 'COMBAT_REROLL_THINKING' }, '*');
    });
    document.getElementById('btn-reroll-text').addEventListener('click', () => {
      window.parent.postMessage({ type: 'COMBAT_REROLL_TEXT' }, '*');
    });
    document.getElementById('btn-skip').addEventListener('click', () => {
      window.parent.postMessage({ type: 'COMBAT_SKIP' }, '*');
    });
  </script>
</body>
</html>
